services:
  postgres:
    image: postgres:16-alpine
    container_name: paki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paki
    ports:
      - "5432:5432"
    volumes:
      - paki-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paki-pgdata:
